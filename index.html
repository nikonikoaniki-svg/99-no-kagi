er;line-height:1.55}.math .mark{background:#ffdf79;border-radius:9px;padding:0 7px}.miniMath{font-size:clamp(22px,3.2vw,31px);font-weight:900;text-align:center;margin:15px 0}.inputRow{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:19px 0}.num{font-size:36px;width:100px;min-width:0;text-align:center;border:3px solid #789bd3;border-radius:13px;padding:11px;background:#fff;color:#17335e!important;-webkit-text-fill-color:#17335e!important;opacity:1;font-weight:900;caret-color:#2563eb}.num:focus{background:#edf5ff;border-color:#2764dd}.num::placeholder{color:#92a4bc;-webkit-text-fill-color:#92a4bc}.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.inputRow .sym{font-size:30px;font-weight:900}.numberPad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:390px;margin:8px auto 14px}.padDigit{border:2px solid #bfcee6;border-radius:12px;background:#fff;color:#20324b;font-weight:900;font-size:23px;min-height:52px}.padDigit:active{background:#dbeafe}.inputHelp{text-align:center;font-size:14px;font-weight:800;color:#466388;margin-top:-6px}.explain{background:#eff6ff;border:1px solid #bdd2f8;border-radius:15px;padding:16px;margin:14px 0;font-weight:700;line-height:1.8}.examples{max-width:620px;margin:0 auto}.arrays{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:18px 0}.array{display:grid;gap:5px;padding:10px;border:2px solid #bfd1ef;border-radius:12px;background:#fbfdff}.array-dot{width:15px;height:15px;border-radius:50%;background:#3b75dd}.arrayLabel{text-align:center;font-weight:900;margin:7px 0}.center{text-align:center}.screenBadge{background:#eaf0fc;color:#315794;padding:8px 12px;border-radius:999px;font-weight:900;font-size:13px}.keyfind{background:#fffbea;border:1px solid #efd48d;border-radius:13px;padding:13px;line-height:1.7;margin:12px 0}.rankbox{background:linear-gradient(120deg,#fef5d8,#fff);border:1px solid #f4d37b;bord </style></head><body><div id="root"><header><div class="logo"><span class="logo-mark">🔑</span><span>九九のかぎ</span></div><nav><button class="icon" id="goHome">🏠</button><button class="icon" id="goMap">九九マップ</button><button class="icon" id="toggleSound">🔊</button></nav></header><main id="app"></main><div class="footer">このたんまつに きろくを ほぞんします。ネットがなくても あそべます。</div></div><div id="overlay"></div>
<script>
'use strict';
const E=[[2,3],[2,4],[2,7],[2,8],[4,5],[4,6],[4,9],[6,7],[6,8],[8,9]];
const O=[[3,2],[5,3],[5,4],[7,2],[7,5],[7,6],[9,3],[9,4],[9,7],[9,8]];
const STAGES=['しきづくり','ひっくりかえそう','なかまを みつけよう','10この かぎを みつけよう','たして つくろう','ひいて つくろう','たす？ ひく？','九九の ちからだめし'];
const RANKS=[{n:0,t:'九九のたまご'},{n:5,t:'九九のひよこ'},{n:10,t:'九九のたんけんか'},{n:20,t:'九九のぼうけんか'},{n:30,t:'九九のけんきゅうか'},{n:40,t:'九九のめいじん'},{n:50,t:'九九のたつじん'},{n:60,t:'九九のはかせ'},{n:70,t:'九九のゆうしゃ'},{n:81,t:'九九マスター'}];
const app=document.getElementById('app'),overlay=document.getElementById('overlay');
function blankRoute(){return {unlocked:1,done:[],open:[],found:[]};}
function load(){let s;try{s=JSON.parse(localStorage.getItem('kuku-keys-2026-v1')||'null')}catch(e){};
 return {route:s?.route==='odd'?'odd':'even',sound:s?.sound!==false,seen:s?.seen===true,settings:{mode:s?.settings?.mode==='time'?'time':'count',count:s?.settings?.count||5,seconds:s?.settings?.seconds||60,hint:s?.settings?.hint===true,testScope:s?.settings?.testScope==='keys'?'keys':'all'},routes:{even:{...blankRoute(),...s?.routes?.even},odd:{...blankRoute(),...s?.routes?.odd}}};}
let S=load(),Q=null,T=0,lockedAnswer=false,timer=null,audio=null;function data(){return S.routes[S.route]}function keySet(){return S.route==='even'?E:O}function pair(k){return k.join('×')}function id(a,b){return `${a}-${b}`}function save(){localStorage.setItem('kuku-keys-2026-v1',JSON.stringify(S))}function rnd(n){return Math.floor(Math.random()*n)}function pick(a){return a[rnd(a.length)]}function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){let j=rnd(i+1);[c[i],c[j]]=[c[j],c[i]]}return c}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function sound(notes,kind='sine'){if(!S.sound)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();notes.forEach(([hz,offset,dur],i)=>{let osc=audio.createOscillator(),g=audio.createGain();osc.type=kind;osc.frequency.value=hz;let t=audio.currentTime+offset;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(g);g.connect(audio.destination);osc.start(t);osc.stop(t+dur+.02)})}catch(e){}}
function chime(){sound([[659,0,.14],[784,.13,.19]])}function fanfare(){sound([[523,0,.2],[659,.19,.2],[784,.38,.23],[1046,.60,.47]],'triangle')}function rankSound(){sound([[523,0,.15],[659,.15,.15],[784,.3,.17],[988,.46,.22],[1175,.68,.5]],'triangle')}
function setSound(){document.getElementById('toggleSound').textContent=S.sound?'🔊':'🔇'}
function cleanup(){if(timer)clearInterval(timer);timer=null;lockedAnswer=false}
function go(fn){cleanup();fn()}
function modal(icon,title,body,button,fn,kind='unlock'){overlay.innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><div class="modal"><span class="large">${icon}</span><h2>${title}</h2><p>${body}</p><button class="btn" id="modalBtn">${button}</button></div></div>`;document.getElementById('modalBtn').onclick=()=>{overlay.innerHTML='';fn?.()};kind==='quiet'?null:kind==='rank'?rankSound():fanfare()}
function rank(count){let i=0;for(let j=0;j<RANKS.length;j++){if(count>=RANKS[j].n)i=j}return i}function rankDisplay(){const n=data().open.length,r=rank(n),next=RANKS[r+1];return `<div class="rankbox"><strong>🏅 ${RANKS[r].t}</strong><div class="small">あけたマス：${n} / 81　${next?`つぎの しょうごうまで あと ${next.n-n} マス`:'ぜんぶ あけた！'}</div><div class="progress"><div style="width:${100*n/81}%"></div></div></div>`}
function mapBoard(compact=false,picker=false){const ks=new Set(keySet().map(x=>id(...x))),opened=new Set(data().open);let html=`<div class="board ${compact?'compact':''}"><div class="mapcell head">×</div>`;for(let b=1;b<=9;b++)html+=`<div class="mapcell head">${b}</div>`;
 for(let a=1;a<=9;a++){html+=`<div class="mapcell head">${a}</div>`;for(let b=1;b<=9;b++){let tag=id(a,b),isKey=ks.has(tag),isOpen=opened.has(tag),isFound=data().found.includes(tag);let mark=isOpen?'✓':isKey?'🔑':'·';if(picker)mark=isFound?'✓':isKey?'🔑':'·';html+=`<button class="mapcell ${isKey?'key':''} ${isOpen?'open':''} ${picker&&isFound?'open':''}" ${picker?`data-pair="${tag}" onclick="findKey(${a},${b})"`:`onclick="mapCell(${a},${b})"`} aria-label="${a}かける${b}${isKey?'、九九のかぎ':''}${isOpen?'、あけた':''}"><span class="${isOpen?'tick':''}">${mark}</span>${isOpen?`<span class="prod">${a*b}</span>`:''}</button>`;}}return html+'</div>'}
function routeLabel(){return S.route==='even'?'ぐうすうルート':'きすうルート'}

function neighbours(k){let [a,b]=k;return [[a-1,b],[a+1,b],[a,b-1],[a,b+1]].filter(([x,y])=>x>=1&&x<=9&&y>=1&&y<=9)}
function relation(key,target){let [a,b]=key,[c,d]=target;if(a===c)return {n:a,s:d>b?'+':'−'};if(b===d)return {n:b,s:c>a?'+':'−'};throw Error('not neighbours')}

// STEP 3: 1問に正解は1つ。おなじ式から別の「なかま」も問う。
function makeNeighborPlan(){
 // 「たす」と「ひく」を必ず同じ回数入れ、出題順だけランダムにする。
 // 1つの九九から、別の方向のなかまも別問題で出す。
 const bases=shuffle([[2,3],[2,4],[3,3],[3,4],[4,5],[4,6]]).slice(0,3);
 const plan=[];
 for(const k of bases){
  const ns=neighbours(k);
  const plus=ns.filter(t=>relation(k,t).s==='+');
  const minus=ns.filter(t=>relation(k,t).s==='−');
  if(plus.length) plan.push({k:[...k],target:[...pick(plus)],kind:'plus'});
  if(minus.length) plan.push({k:[...k],target:[...pick(minus)],kind:'minus'});
 }
 return shuffle(plan);
}
function makeQuestion(stage){if(stage===1){let a=2+rnd(8),b=2+rnd(8);return {a,b,fruitKind:pick(['🍊','🍎','🍓','⭐'])}}if(stage===2){let a=2+rnd(4),b=2+rnd(5);if(a===b)b=(b%5)+2;let correct=`${b}×${a}`,bad=shuffle(Array.from({length:20},()=>`${2+rnd(8)}×${2+rnd(8)}`).filter(x=>x!==correct&&x!==`${a}×${b}`&&x.split('×').map(Number).reduce((v,w)=>v*w,1)!==a*b));return {a,b,arr:shuffle([correct,...new Set(bad)].slice(0,4)),correct}}
 if(stage===3){
  const planned=Q.neighborPlan[Q.asked],k=planned.k,target=planned.target;
  const neigh=neighbours(k),bad=[];
  // その他の正しい「なかま」をフェイクとして出さない。
  const seen=new Set([...neigh.map(p=>id(...p)),id(...k)]);
  const pool=[];
  for(let a=1;a<=9;a++)for(let b=1;b<=9;b++){
   if(seen.has(id(a,b)))continue;
   // 片方だけ同じ、でも2以上ちがう式を優先。
   const close=(a===k[0]&&Math.abs(b-k[1])>=2)||(b===k[1]&&Math.abs(a-k[0])>=2);
   pool.push({pair:[a,b],close});
  }
  const near=shuffle(pool.filter(p=>p.close));
  const other=shuffle(pool.filter(p=>!p.close));
  bad.push(...near.slice(0,2).map(p=>p.pair));
  bad.push(...other.slice(0,1).map(p=>p.pair));
  if(bad.length<3)bad.push(...other.slice(1,4-bad.length).map(p=>p.pair));

 }
 if(stage===5||stage===6||stage===7){let ks=stage===5||stage===7?keySet().slice(0,7):keySet().slice(0,7);let k=pick(ks),ns=neighbours(k).filter(p=>{let r=relation(k,p);return stage===7||r.s===(stage===5?'+':'−')});let target=pick(ns),r=relation(k,target);return{k,target,r,ans:target[0]*target[1]}}
 }
function renderQuestion(){const s=Q.stage,q=Q.question;
 if(s===1){selectedFactorField='factorA';questionShell('この かけざんの しきは？','「ひとつぶんの かず × いくつぶん」の じゅんで かこう。',`${fruit(q.a,q.b,q.fruitKind)}<div class="inputRow"><input class="num" id="factorA" type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" placeholder="？" autocomplete="off" aria-label="ひとつぶんの数" onfocus="setFactorField('factorA')" oninput="syncFactorField(this)"><span class="sym">×</span><input class="num" id="factorB" type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" placeholder="？" autocomplete="off" aria-label="いくつぶん" onfocus="setFactorField('factorB')" oninput="syncFactorField(this)"></div><div class="inputHelp">はこを おして すうじを いれよう</div>${factorPad()}<div class="buttons" style="justify-content:center"><button class="btn" onclick="checkFormula()">こたえあわせ</button></div>`);return}
 if(s===2){questionShell(`${q.a}×${q.b} と おなじ こたえは？`,'まるを ひっくりかえして かんがえよう。',`<div class="arrays">${array(q.b,q.a)}<b style="font-size:29px">⇄</b>${array(q.a,q.b)}</div>${options(q.arr,'checkSingle')}`);return}
 if(s===3){questionShell(`${pair(q.k)} の なかまは どれ？`,'「たす」か「ひく」で つくれる なかまを、4つから 1つ えらぼう。',`<div class="rule-box" style="margin-top:0">なかま = <b>おなじ かずが 1つ</b>、もう 1つは <b>1ちがい</b><br><span class="small">この しきから 1こぶん たす・ひく と つくれるよ。</span></div>${options(q.choices.map(pair),'checkNeighbor')}`);return}
 if(s>=5&&s<=7){const key=`${pair(q.k)}＝${q.k[0]*q.k[1]}`,target=pair(q.target),r=q.r;let phase=Q.phase;
 let label=phase===0?'かわらない かずは どれ？':phase===1? (s===7?'たす？ ひく？':`なにを ${s===5?'たす':'ひく'}？`):'こたえは いくつ？';let vals=[];let correct;
 if(phase===0){correct=String(r.n);vals=shuffle([...new Set([r.n,q.k[0],q.k[1],q.target[0],q.target[1],1+rnd(9),2+rnd(8)])].map(String));while(vals.length<4){let x=String(1+rnd(9));if(!vals.includes(x))vals.push(x)}vals=shuffle(vals.slice(0,4));if(!vals.includes(correct))vals[0]=correct}
 if(phase===1){correct=r.s+String(r.n);vals=shuffle([...new Set([`+${r.n}`,`−${r.n}`,`+${q.k[0]}`,`−${q.k[0]}`,`+${q.k[1]}`,`−${q.k[1]}`])].slice(0,4));if(!vals.includes(correct))vals[0]=correct}
 if(phase===2){correct=String(q.ans);let c=new Set([q.ans]);while(c.size<4){let d=q.ans+pick([-9,-7,-6,-5,-4,-3,-2,2,3,4,5,6,7,9]);if(d>0&&d<=81)c.add(d)}vals=shuffle([...c].map(String))}
 Q.currentOptions=vals;Q.currentCorrect=correct;
 questionShell(label,S.settings.hint?'かぎを みながら かんがえて OK！':'じぶんで かんがえて みよう。',`<div class="keyfind center"><b>九九のかぎ：${key}</b></div><div class="math">${pair(q.target)}＝？</div>${phase===1?`<p class="subQuestion">かわらない かずは ${r.n} だね。</p>`:''}${phase===2?`<div class="miniMath">${q.k[0]*q.k[1]} ${r.s} ${r.n} ＝ □</div>`:''}${options(vals,'checkSingle')}`);return}
}
function checkFormula(){if(lockedAnswer)return;if(!document.getElementById('factorA').value||!document.getElementById('factorB').value){let f=document.getElementById('fb');f.className='feedback try';f.textContent='ふたつの はこに すうじを いれてね。';return}let a=Number(document.getElementById('factorA').value),b=Number(document.getElementById('factorB').value),q=Q.question;let ok=a===q.a&&b===q.b;feedback(ok,ok?`${q.a}こずつが ${q.b}つ。${q.a}×${q.b}！`:`ひとつの まとまりは ${q.a}こ。まとまりは ${q.b}つ だよ。`,()=>advance(ok),true)}
function checkSingle(i){if(lockedAnswer)return;let s=Q.stage,q=Q.question,v=s===2?q.arr[i]:Q.currentOptions[i],ok=s===2?v===q.correct:v===Q.currentCorrect;let msg=s===2?(ok?`${q.a}×${q.b} と ${q.b}×${q.a} は おなじ こたえ！`:'まえと うしろの かずを いれかえてみよう。'):(ok?`いいね！ ${v} が せいかい！`:'かわらない かずを もういちど みてみよう。');feedback(ok,msg,()=>{if(s>=5){if(Q.phase<2){Q.phase++;renderQuestion()}else{Q.phase=0;advance(true)}}else advance(true)},true);if(!ok&&s>=5)Q.attempts++}
function toggleChoice(i){if(lockedAnswer)return;let pos=Q.selected.indexOf(i);if(pos>=0)Q.selected.splice(pos,1);else Q.selected.push(i);document.querySelectorAll('.option').forEach((b,j)=>b.classList.toggle('selected',Q.selected.includes(j)))}
function checkNeighbor(i){
 if(lockedAnswer)return;
 const q=Q.question,chosen=q.choices[i],ok=id(...chosen)===q.correct;
 let msg;
 if(ok){
  const r=relation(q.k,chosen);
  msg=`そのとおり！ ${pair(q.k)} → ${pair(chosen)}。かわらない ${r.n} を ${r.s==='+'?'たす':'ひく'} と つくれるよ。`;
 }else{
  msg='おしい！ おなじ かずが 1つ、もう 1つは 1だけ ちがう しきを さがそう。';
 }
 feedback(ok,msg,()=>advance(true),true);
}
function checkMultiple(){if(lockedAnswer)return;let q=Q.question,correct=q.correct;let picked=new Set(Q.selected.map(i=>id(...q.choices[i])));let ok=picked.size===correct.size&&[...correct].every(k=>picked.has(k));feedback(ok,ok?'なかまを ぜんぶ みつけた！':'おなじ かずが 1つ あって、もう 1つが 1だけ ちがうか たしかめよう。',()=>advance(true),true)}
function feedback(ok,text,onSuccess,stayOnWrong=false){let fb=document.getElementById('fb');fb.className='feedback '+(ok?'ok':'try');fb.textContent=(ok?'◎ ':'')+text;if(ok){lockedAnswer=true;chime();setTimeout(()=>{lockedAnswer=false;onSuccess()},650)}else{Q.attempts++;sound([[250,0,.10]],'sine');}}
function advance(ok){Q.asked++;if(ok)Q.correct++;if(Q.stage>=5)Q.phase=0;nextQuestion()}
function finishStage(){let pass=Q.correct>=Math.ceil(Q.total*.8),n=Q.stage;app.innerHTML=`<section class="card quiz center"><div style="font-size:55px">${pass?'🎉':'🌱'}</div><h2>${pass?'クリア！':'もう いちど やってみよう'}</h2><div class="stats"><div class="stat"><span class="small">できた</span><b>${Q.correct} / ${Q.total}</b></div></div><p>${pass?'また ひとつ できることが ふえたね！':'わからない ところは せつめいに もどって みよう。'}</p><div class="buttons" style="justify-content:center"><button class="btn" onclick="${pass?`complete(${n})`:`startStage(${n},false)`}">${pass?'つぎへ':'もういちど'}</button><button class="btn light" onclick="renderHome()">ホームへ</button></div></section>`}
function complete(n){const d=data(),was=d.unlocked;if(!d.done.includes(n))d.done.push(n);if(n===d.unlocked&&n<8)d.unlocked=n+1;save();if(d.unlocked>was){modal('🔓','あたらしい ステップが あいた！',`STEP ${d.unlocked}「${STAGES[d.unlocked-1]}」が できるように なったよ！`,'つぎへ',()=>startStage(d.unlocked))}else renderHome()}
// 10個の鍵を見つける: すべての鍵の位置を発見、暗記はさせない。
function renderFind(){if(!Q)Q={stage:4};const found=new Set(data().found),all=keySet(),next=all.find(p=>!found.has(id(...p)));app.innerHTML=`<section class="card"><div class="stageHeader"><div><span class="tag">STEP 4</span><h2 style="margin:12px 0 0">10この かぎを みつけよう</h2></div><button class="btn light sm" onclick="stageIntro(4)">せつめい</button></div><p>きいろい ところが 九九のかぎ。<b>きいろい マスを タップして みつけよう！</b><br>こたえを おぼえていなくても だいじょうぶ。</p><div class="keyfind">みつけた かぎ：<b>${found.size} / 10</b>${next?`<br>つぎは <b>${next[0]}のだん</b> を さがしてみよう。`:''}</div><div class="mapbox">${mapBoard(false,true)}</div><p class="hint" style="margin-top:10px">みつけた かぎは ✓ に かわるよ。これは「ちからだめし」で マスを あけた ことには ならないよ。</p><div class="buttons"><button class="btn light" onclick="renderHome()">ホームへ</button>${found.size===10?'<button class="btn" onclick="finishFind()">かぎを あつめた！ →</button>':''}</div></section>`}
function findKey(a,b){if(!Q||Q.stage!==4)return;let tag=id(a,b),isKey=keySet().some(k=>id(...k)===tag);if(!isKey){sound([[250,0,.1]]);return}if(!data().found.includes(tag)){data().found.push(tag);save();chime()}renderFind()}
function finishFind(){if(data().found.length<10)return;Q={stage:4,correct:10,total:10};finishStage()}
function selectTestScope(scope){S.settings.testScope=scope;save();setupTest()}
function setupTest(){
 cleanup();const keyMode=S.settings.testScope==='keys';
 app.innerHTML=`<section class="card quiz"><span class="tag">STEP 8</span><h2 style="margin:13px 0">九九の ちからだめし</h2>${rankDisplay()}
 <p>九九の こたえを じぶんで かこう。<br>せいかいした マスだけが ひらくよ！</p>
 <div class="settingGroup"><strong>もんだいを えらぼう</strong>
 <div class="choiceRow" style="margin-top:10px">
 <button class="selectbtn ${keyMode?'chosen':''}" onclick="selectTestScope('keys')">🔑 九九のかぎ 10もん</button>
 <button class="selectbtn ${!keyMode?'chosen':''}" onclick="selectTestScope('all')">九九ぜんぶから</button></div>
 <p class="small" style="margin-top:9px">${keyMode?'きいろい 10この かぎが、1かいずつ でるよ。じゅんばんは ランダム！':'1から9の 九九を じぶんで といてみよう。'}</p></div>
 ${keyMode?'':`<div class="settingGroup"><strong>あそびかた</strong><div class="choiceRow"><button class="selectbtn ${S.settings.mode==='count'?'chosen':''}" onclick="S.settings.mode='count';save();setupTest()">もんだいすう</button><button class="selectbtn ${S.settings.mode==='time'?'chosen':''}" onclick="S.settings.mode='time';save();setupTest()">タイム</button></div><div class="choiceRow" style="margin-top:9px">${(S.settings.mode==='count'?[5,10,20,30]:[30,60,120,180]).map(n=>`<button class="selectbtn ${n===(S.settings.mode==='count'?S.settings.count:S.settings.seconds)?'chosen':''}" onclick="S.settings.${S.settings.mode==='count'?'count':'seconds'}=${n};save();setupTest()">${S.settings.mode==='count'?n+'もん':n===30?'30びょう':n/60+'ふん'}</button>`).join('')}</div></div>`}
 <div class="buttons"><button class="btn" onclick="startTest()">スタート！</button><button class="btn alt" onclick="openMap()">九九マップ</button><button class="btn light" onclick="renderHome()">ホーム</button></div></section>`;
}
function startTest(){
 cleanup();const keyMode=S.settings.testScope==='keys';
 let pending;
 if(keyMode)pending=shuffle(keySet());
 else {let all=[];for(let a=1;a<=9;a++)for(let b=1;b<=9;b++)all.push([a,b]);pending=shuffle(all.filter(p=>!data().open.includes(id(...p))))}
 Q={stage:8,scope:keyMode?'keys':'all',correct:0,asked:0,total:keyMode?10:(S.settings.mode==='count'?S.settings.count:Infinity),start:Date.now(),pending,used:[],onQuestion:false,busy:false};
 nextTest();
 if(!keyMode&&S.settings.mode==='time'){
 timer=setInterval(()=>{if(!Q||Q.stage!==8)return;let left=S.settings.seconds-Math.floor((Date.now()-Q.start)/1000),t=document.getElementById('remaining');if(t)t.textContent=`のこり ${Math.max(0,left)}びょう`;if(left<=0){cleanup();finishTest()}},250);
 }
}
function nextTest(){
 if(!Q||Q.stage!==8)return;
 let elapsed=Math.floor((Date.now()-Q.start)/1000),keyMode=Q.scope==='keys';
 if(Q.asked>=Q.total||(!keyMode&&S.settings.mode==='time'&&elapsed>=S.settings.seconds)){finishTest();return}
 let p;
 if(Q.pending.length)p=Q.pending.shift();
 else if(keyMode){finishTest();return}
 else {const all=[];for(let a=1;a<=9;a++)for(let b=1;b<=9;b++)all.push([a,b]);p=pick(all)}
 Q.current=p;Q.busy=false;let left=S.settings.seconds-elapsed;
 app.innerHTML=`<section class="card quiz"><div class="stageHeader"><span class="tag">${keyMode?'🔑 九九のかぎ 10もん':'九九の ちからだめし'}</span><span class="screenBadge" id="remaining">${keyMode||S.settings.mode==='count'?`${Q.asked+1} / ${Q.total} もん`:`のこり ${Math.max(0,left)}びょう`}</span></div>
 <div class="question">こたえは いくつ？</div>
 <div class="math" style="margin:20px 0">${p[0]} × ${p[1]} ＝ □</div>
 <div class="inputRow"><input id="testAnswer" class="num" style="width:155px" type="number" inputmode="numeric" min="0" max="81" autocomplete="off" aria-label="かけざんのこたえ" autofocus></div>
 <div class="buttons" style="justify-content:center"><button class="btn" onclick="checkTest()">こたえあわせ</button><button class="btn light" onclick="skipTest()">わからない・つぎへ</button></div>
 <div id="fb" class="feedback">じぶんの ちからで かんがえよう。</div>
 <p class="small" style="margin-top:15px">※ちからだめしでは ヒントは でないよ。</p>
 <div class="buttons"><button class="btn light sm" onclick="stopTest()">おわる</button></div></section>`;
 document.getElementById('testAnswer').addEventListener('keydown',e=>{if(e.key==='Enter')checkTest()});
}
function checkTest(){if(!Q||Q.busy)return;let input=document.getElementById('testAnswer');if(!input.value.trim()){input.focus();return}let a=Number(input.value),p=Q.current,ok=a===p[0]*p[1];Q.busy=true;Q.asked++;let tag=id(...p),newOpen=false,oldRank=rank(data().open.length);if(ok){Q.correct++;if(!data().open.includes(tag)){data().open.push(tag);newOpen=true;save()}chime()}else sound([[250,0,.14]]);let fb=document.getElementById('fb');fb.className='feedback '+(ok?'ok':'try');fb.textContent=ok?(newOpen?`${p[0]}×${p[1]} の マスが あいた！`:'せいかい！ この マスは もう あいているよ。'):`こたえは ${p[0]*p[1]}。あとで もういちど ためしてみよう。`;document.querySelectorAll('button').forEach(b=>{if(b.closest('.quiz'))b.disabled=true});setTimeout(()=>{if(!Q||Q.stage!==8)return;let newRank=rank(data().open.length);if(newRank>oldRank){modal('🏅','ランクアップ！',`${RANKS[newRank].t} に なったよ！<br>九九を ${data().open.length} マス あけた！`,'つづける',nextTest,'rank')}else nextTest()},1000)}
function skipTest(){if(!Q||Q.busy)return;Q.busy=true;Q.asked++;nextTest()}function stopTest(){if(!Q||Q.stage!==8)return;finishTest()}
function finishTest(){if(!Q||Q.stage!==8)return;let got=Q.correct,asked=Q.asked;cleanup();if(!data().done.includes(8))data().done.push(8);save();app.innerHTML=`<section class="card quiz center"><div style="font-size:55px">🎊</div><h2>${Q.scope==='keys'?'九九のかぎ 10もん おわり！':'ちからだめし おわり！'}</h2><div class="stats"><div class="stat"><span class="small">せいかい</span><b>${got} もん</b></div><div class="stat"><span class="small">やった もんだい</span><b>${asked} もん</b></div></div>${rankDisplay()}<div class="buttons" style="justify-content:center"><button class="btn" onclick="setupTest()">もういちど</button><button class="btn alt" onclick="openMap()">九九マップを みる</button><button class="btn light" onclick="renderHome()">ホームへ</button></div></section>`}
document.getElementById('goHome').onclick=()=>go(renderHome);document.getElementById('goMap').onclick=()=>go(openMap);document.getElementById('toggleSound').onclick=()=>{S.sound=!S.sound;save();setSound();if(S.sound)chime()};setSound();
if(!S.seen){S.seen=true;save();intro(0)}else renderHome();

/* v5: fit every rendered screen into the viewport without any scroll. */
(function(){
  const main=document.getElementById('app');
  let scheduled=false, busy=false;
  function fit(){
    if(busy)return;
    busy=true;
    try {
      let wrapper=main.querySelector(':scope > .screen-fit');
      if(!wrapper){
        wrapper=document.createElement('div');
        wrapper.className='screen-fit';
        while(main.firstChild)wrapper.appendChild(main.firstChild);
        main.appendChild(wrapper);
      }
      wrapper.style.transform='none';
      wrapper.style.width='100%';
      const available=Math.max(1,main.clientHeight-parseFloat(getComputedStyle(main).paddingTop)-parseFloat(getComputedStyle(main).paddingBottom));
      const needed=Math.max(1,wrapper.scrollHeight);
      const scale=Math.min(1,available/needed);
      wrapper.style.transform=`scale(${scale})`;
      wrapper.dataset.scale=scale.toFixed(3);
    }finally{busy=false;scheduled=false;}
  }
  function schedule(){if(scheduled||busy)return;scheduled=true;requestAnimationFrame(fit);}
  const obs=new MutationObserver(schedule);
  obs.observe(main,{childList:true,subtree:false});
  window.addEventListener('resize',schedule);
  window.addEventListener('orientationchange',schedule);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',schedule);
  schedule();
})();
